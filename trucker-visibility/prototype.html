<title>Trucker Visibility Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Apple look. Page = desktop backdrop. TAS = iPhone + demo utility windows. Command Center = macOS window with a source-list sidebar. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#F5F5F7; --fill:#E9E9EE; --ink:#1D1D1F; --muted:#6E6E73; --line:#D8D8DD;
  --magenta:#007AFF; --violet:#5856D6; --on-accent:#FFFFFF; /* --magenta is the accent token used across the markup: iOS system blue */
  --hit:#248A3D; --hit-bg:#E2F6E7; --miss:#D70015; --miss-bg:#FFE6E8; --risk:#B25000; --risk-bg:#FFF0DC;
  --info:#0A7AA8; --info-bg:#E1F2FA; --neutral-bg:#ECECF0;
  --desk:linear-gradient(160deg,#E4EAF4 0%,#ECE7F2 55%,#F3EDE8 100%);
  --side:rgba(232,232,238,.78); --bar:rgba(248,248,250,.86);
  --bezel:#1D1D1F; --land:#F3F0EA; --water:#AFD4F0; --road:#F3C56A; --halo:#F3F0EA;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"IBM Plex Mono",monospace;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --win-shadow:0 0 0 .5px rgba(0,0,0,.16),0 24px 60px -14px rgba(30,30,60,.32);
  /* TAS on iPhone */
  --p-bg:#F2F2F7; --p-card:#FFFFFF; --p-ink:#000000; --p-muted:#6C6C70; --p-sep:rgba(60,60,67,.2); --p-fill:#E3E3E8; --p-tint:#007AFF;
  --p-green:#34C759; --p-orange:#FF9500; --p-red:#FF3B30; --p-glass:rgba(255,255,255,.92);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161618; --surface:#1E1E20; --sunk:#252527; --fill:#3A3A3C; --ink:#F5F5F7; --muted:#98989D; --line:#38383B;
  --magenta:#0A84FF; --violet:#5E5CE6; --on-accent:#FFFFFF;
  --hit:#30D158; --hit-bg:#0F2E1A; --miss:#FF453A; --miss-bg:#3B1412; --risk:#FF9F0A; --risk-bg:#3A2608;
  --info:#64D2FF; --info-bg:#0D2B3A; --neutral-bg:#2C2C2E;
  --desk:linear-gradient(160deg,#12141C 0%,#19151F 55%,#1E1916 100%);
  --side:rgba(44,44,48,.78); --bar:rgba(34,34,36,.86);
  --bezel:#0B0B0C; --land:#2A2A2C; --water:#1B3654; --road:#6E5A2E; --halo:#2A2A2C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.3); --win-shadow:0 0 0 .5px rgba(255,255,255,.12),0 24px 60px -14px rgba(0,0,0,.75);
  --p-bg:#000000; --p-card:#1C1C1E; --p-ink:#FFFFFF; --p-muted:#98989F; --p-sep:rgba(84,84,88,.65); --p-fill:#2C2C2E; --p-tint:#0A84FF;
  --p-green:#30D158; --p-orange:#FF9F0A; --p-red:#FF453A; --p-glass:rgba(44,44,46,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161618; --surface:#1E1E20; --sunk:#252527; --fill:#3A3A3C; --ink:#F5F5F7; --muted:#98989D; --line:#38383B;
  --magenta:#0A84FF; --violet:#5E5CE6; --on-accent:#FFFFFF;
  --hit:#30D158; --hit-bg:#0F2E1A; --miss:#FF453A; --miss-bg:#3B1412; --risk:#FF9F0A; --risk-bg:#3A2608;
  --info:#64D2FF; --info-bg:#0D2B3A; --neutral-bg:#2C2C2E;
  --desk:linear-gradient(160deg,#12141C 0%,#19151F 55%,#1E1916 100%);
  --side:rgba(44,44,48,.78); --bar:rgba(34,34,36,.86);
  --bezel:#0B0B0C; --land:#2A2A2C; --water:#1B3654; --road:#6E5A2E; --halo:#2A2A2C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.3); --win-shadow:0 0 0 .5px rgba(255,255,255,.12),0 24px 60px -14px rgba(0,0,0,.75);
  --p-bg:#000000; --p-card:#1C1C1E; --p-ink:#FFFFFF; --p-muted:#98989F; --p-sep:rgba(84,84,88,.65); --p-fill:#2C2C2E; --p-tint:#0A84FF;
  --p-green:#30D158; --p-orange:#FF9F0A; --p-red:#FF453A; --p-glass:rgba(44,44,46,.92); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--desk);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.42;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--magenta) 55%,transparent);outline-offset:1px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:var(--muted)}
.ic{display:block;flex:none}

/* App icon (brand) */
.appicon{border-radius:22%;background:linear-gradient(160deg,#C2006B 0%,#4B1FA8 100%);display:grid;place-items:center;flex:none;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px rgba(75,31,168,.28)}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--muted);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

/* Top shell bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.1;display:block;font-weight:700}
.brand small{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--fill);padding:2px;border-radius:9px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:5px 14px;border-radius:7px;font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06)}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.clock .mono{font-size:13px;font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--hit)}
.sample{font-size:11px;background:var(--risk-bg);color:var(--risk);padding:2px 8px;border-radius:99px;font-weight:600}
.wrap{padding-block:22px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}

/* Shared controls (macOS) */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.c-hit{background:var(--hit-bg);color:var(--hit)} .c-miss{background:var(--miss-bg);color:var(--miss)}
.c-risk{background:var(--risk-bg);color:var(--risk)} .c-info{background:var(--info-bg);color:var(--info)}
.c-neutral{background:var(--neutral-bg);color:var(--muted)}
.btn{border:.5px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:6px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center;box-shadow:0 .5px 1.5px rgba(0,0,0,.12)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--magenta);border-color:transparent;color:var(--on-accent)}
.btn.ok{background:var(--hit);border-color:transparent;color:#FFFFFF}
.btn.bad{color:var(--miss)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
textarea.in,input.in,select.in{width:100%;border:.5px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface);font-size:13px;box-shadow:inset 0 .5px 1px rgba(0,0,0,.06)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--fill);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:6px;font-size:12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cheat[aria-pressed="true"]{background:var(--miss)!important;color:#FFFFFF!important}

/* macOS window */
.mac-window{background:var(--surface);border-radius:12px;box-shadow:var(--win-shadow);overflow:hidden;min-width:0}
.mac-titlebar{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bar);border-bottom:.5px solid var(--line);position:relative}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.lights i:nth-child(2){background:#FEBC2E} .lights i:nth-child(3){background:#28C840}
.mac-title{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;white-space:nowrap;max-width:56%;overflow:hidden;text-overflow:ellipsis}
.mac-tb-right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}

/* ============ TAS (iPhone) ============ */
.trucker{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start}
.phone{width:384px;max-width:100%;flex:none;border-radius:60px;padding:12px;background:var(--bezel);box-shadow:0 0 0 2px #8E8E93,0 0 0 3px #3A3A3C,0 40px 80px -24px rgba(0,0,0,.5);position:relative}
.screen{background:var(--p-bg);color:var(--p-ink);border-radius:48px;overflow:hidden;height:790px;max-height:calc(100vh - 110px);min-height:640px;display:flex;flex-direction:column;position:relative;font-size:17px;line-height:1.3;transition:background .25s}
.screen.cam-on{background:#000000;color:#FFFFFF}
.screen.res-ok{background:var(--p-green);color:#FFFFFF}
.screen.res-bad{background:var(--p-red);color:#FFFFFF}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000000;z-index:8}
.sbar{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0 36px;font-size:16px;font-weight:600;position:relative;z-index:7}
.sbi{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:currentColor;opacity:.9;z-index:8}
.pview{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:18px;min-height:0}
.pform{flex:1;display:flex;flex-direction:column;min-height:0}
.pnav{display:flex;justify-content:space-between;align-items:center;padding:2px 12px 0 8px;min-height:40px}
.pnav button{border:0;background:none;color:var(--p-tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:6px 6px}
.ptitle{font-family:var(--f-display);font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.02em;padding:0 20px;margin:0}
.pinstr{font-size:17px;line-height:1.35;color:var(--p-muted);padding:0 20px;margin:0}
.pinstr b{color:var(--p-ink);font-weight:600}
.psec{font-size:13px;color:var(--p-muted);text-transform:uppercase;letter-spacing:.02em;padding:6px 36px 0;margin-bottom:-10px}
.pgroup{margin:0 16px;background:var(--p-card);border-radius:14px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;font-size:17px;width:100%;border:0;background:none;text-align:left;color:var(--p-ink)}
.prow + .prow::before,.pdetails[open] .prow ~ .prow::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--p-sep)}
.prow .sub,.sub{display:block;font-size:15px;color:var(--p-muted);font-weight:400}
.prow b{font-weight:600}
.grow{flex:1;min-width:0}
.picon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#FFFFFF;flex:none}
.ptime{font-weight:600;font-variant-numeric:tabular-nums;min-width:86px}
.plbl{color:var(--p-muted);min-width:90px}
.pdetails summary{list-style:none;cursor:pointer}
.pdetails summary::-webkit-details-marker{display:none}
.pdetails[open] summary .ic:last-child{transform:rotate(90deg)}
.pdetails .prow:not(summary){padding-left:58px}
.pact{flex:none;padding:10px 16px 30px;display:flex;flex-direction:column;gap:10px}
.pbtn{min-height:58px;border-radius:16px;border:0;font-size:19px;font-weight:600;background:var(--p-tint);color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 16px}
.pbtn:active{filter:brightness(.92)}
.pbtn.green{background:var(--p-green)} .pbtn.orange{background:var(--p-orange)}
.pbtn.plain{background:var(--p-fill);color:var(--p-tint)}
.pbtn.white{background:#FFFFFF;color:#000000}
.pbtn:disabled{background:var(--p-fill);color:var(--p-muted)}
.phero{margin:0 16px;background:var(--p-card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hrow{display:flex;gap:12px;align-items:center}
.hname{font-size:20px;font-weight:600;display:block;line-height:1.2}
.pbig{font-family:var(--f-display);font-size:46px;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ppill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:15px;font-weight:600}
.pp-ok{background:color-mix(in srgb,var(--p-green) 18%,transparent);color:var(--hit)}
.pp-warn{background:color-mix(in srgb,var(--p-orange) 20%,transparent);color:var(--risk)}
.pp-bad{background:color-mix(in srgb,var(--p-red) 16%,transparent);color:var(--miss)}
.pp-info{background:color-mix(in srgb,var(--p-tint) 15%,transparent);color:var(--p-tint)}
.proute{margin:0 16px;background:var(--p-card);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.road{position:relative;height:46px}
.road .line{position:absolute;left:22px;right:22px;top:21px;height:4px;border-radius:2px;background:var(--p-fill)}
.road .done{position:absolute;left:22px;top:21px;height:4px;border-radius:2px;background:var(--p-tint)}
.road .truckdot{position:absolute;top:0;width:46px;height:46px;border-radius:50%;background:var(--p-tint);color:#FFFFFF;display:grid;place-items:center;transform:translateX(-50%);box-shadow:0 4px 12px color-mix(in srgb,var(--p-tint) 40%,transparent);transition:left 1s linear}
.road .flag{position:absolute;right:0;top:5px;width:36px;height:36px;border-radius:50%;background:var(--p-green);color:#FFFFFF;display:grid;place-items:center}
.road-txt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.eta{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.palert{margin:0 16px;background:var(--p-red);color:#FFFFFF;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start;font-size:16px}
.parrive{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 20px 0;text-align:center}
.bigcheck{width:128px;height:128px;border-radius:50%;background:var(--p-green);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 10px 30px color-mix(in srgb,var(--p-green) 45%,transparent)}
.offline-bar{margin:0 16px 8px;background:var(--p-orange);color:#FFFFFF;border-radius:12px;padding:9px 12px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;flex:none}
.toast{position:absolute;top:58px;left:10px;right:10px;background:var(--p-glass);color:var(--p-ink);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:20px;padding:12px 14px;font-size:15px;z-index:9;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast b{display:block;font-size:13px;color:var(--p-muted);font-weight:600}
.psplash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.psplash-name{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:.04em}
.psplash-sub{font-size:16px;color:var(--p-muted)}
.plogo{display:flex;justify-content:center;padding-top:18px}
.pfield-row input{border:0;background:none;font-size:17px;flex:1;min-width:0;outline:none;color:var(--p-ink)}
.pfield-row + .pfield-row::before{left:16px!important}
.perr{margin:0 16px;background:color-mix(in srgb,var(--p-red) 14%,transparent);color:var(--miss);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600}
.cam{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.camtop{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 0}
.camx{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#FFFFFF;display:grid;place-items:center}
.campill{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.camtxt{margin:0;padding:0 24px;text-align:center;font-size:22px;font-weight:600;line-height:1.25}
.finder{margin:0 16px;border-radius:18px;aspect-ratio:4/3;position:relative;overflow:hidden;max-width:100%;background:#111111}
.finder svg{width:100%;height:100%;display:block}
.qrframe{position:absolute;inset:20% 27%;border:3px solid #FFD60A;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.scanline{position:absolute;left:27%;right:27%;height:2px;background:#FFD60A;top:50%;animation:scanl 1.6s ease-in-out infinite alternate}
@keyframes scanl{from{top:22%}to{top:78%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none}}
.camfoot{margin-top:auto;padding:0 16px 34px;display:flex;flex-direction:column;gap:12px;align-items:center}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #FFFFFF;background:#FFFFFF;box-shadow:inset 0 0 0 3px #000000}
.camlink{border:0;background:none;color:#FFD60A;font-size:16px;font-weight:600;padding:6px}
.camerr{margin:0;color:#FF9F95;font-size:15px;font-weight:600;text-align:center}
.manual{width:100%;display:flex;flex-direction:column;gap:10px}
.pinput{width:100%;border:0;border-radius:14px;padding:14px;background:rgba(255,255,255,.14);color:#FFFFFF;font-family:var(--f-mono);font-size:19px;text-transform:uppercase;text-align:center;letter-spacing:.06em}
.pres{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px 26px}
.rescircle{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.restitle{font-family:var(--f-display);font-size:42px;font-weight:800;letter-spacing:-.02em}
.ressub{margin:0;font-size:19px;line-height:1.35;opacity:.95}
.resnote{margin:0;display:flex;gap:6px;align-items:center;font-size:16px;font-weight:600;background:rgba(0,0,0,.14);padding:8px 14px;border-radius:99px}
.resinstr{margin:0 0 2px;text-align:center;font-size:17px;font-weight:600;color:#FFFFFF}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.rtile{background:var(--p-card);border:2px solid transparent;border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;font-size:16px;font-weight:600;line-height:1.2;color:var(--p-ink);min-height:112px}
.rtile[aria-pressed="true"]{border-color:var(--p-tint);background:color-mix(in srgb,var(--p-tint) 10%,var(--p-card))}
.ricon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#FFFFFF}
.pseg{display:flex;background:var(--p-fill);border-radius:10px;padding:2px;margin:0 16px}
.pseg button{flex:1;border:0;background:none;padding:10px 0;font-size:15px;font-weight:600;border-radius:8px;color:var(--p-ink)}

/* ---------- Hit / Miss engine ---------- */
function evaluate(j) {
  const due = j.agreed + S.config.grace * MIN;
  if (j.arrival) return j.arrival.at <= due ? 'HIT' : 'MISS';
  if (S.now > due) return 'MISS_NA';
  if (j.agreed - S.now <= S.config.atRisk * MIN) return 'AT_RISK';
  return 'ON_SCHEDULE';
}
const RESULT_CHIP = {
  HIT:['c-hit','Hit'], MISS:['c-miss','Miss'], MISS_NA:['c-miss','Miss · not arrived'], AT_RISK:['c-risk','At risk'], ON_SCHEDULE:['c-neutral','On schedule'],
};
const resultChip = j => { const [c, t] = RESULT_CHIP[evaluate(j)]; const early = j.arrival && j.arrival.at < j.agreed - 15 * MIN ? ' <span class="chip c-info">Early</span>' : ''; return `<span class="chip ${c}">${t}</span>${early}`; };
function kpis() {
  const r = S.jobs.map(j => ({ j, e: evaluate(j) }));
  const hits = r.filter(x => x.e === 'HIT').length;
  const misses = r.filter(x => x.e === 'MISS' || x.e === 'MISS_NA');
  const decided = hits + misses.length;
  const excused = misses.filter(x => x.j.exception && x.j.exception.status === 'Validated' && x.j.exception.cls === 'Uncontrollable').length;
  const missArrived = misses.filter(x => x.e === 'MISS');
  return {
    total: S.jobs.length, arrived: S.jobs.filter(j => j.arrival).length, hits, misses: misses.length, decided,
    raw: decided ? Math.round(hits / decided * 100) : null,
    adj: decided - excused ? Math.round(hits / (decided - excused) * 100) : null,
    risk: r.filter(x => x.e === 'AT_RISK').length,
    pend: S.jobs.filter(j => j.exception && j.exception.status === 'Pending').length,
    flags: S.jobs.reduce((n, j) => n + j.flags.filter(f => f.status === 'Open').length, 0),
    noExc: missArrived.filter(x => !x.j.exception).length,
    notArrived: misses.filter(x => x.e === 'MISS_NA').length,
  };
}

/* ---------- phone → platform events ---------- */
function plog(type, at, detail) { S.phone.log.unshift({ type, at, detail, queued: !S.phone.online }); }
function emit(ev) {
  plog(ev.type, ev.at, ev.detail || '');
  ev.deviceAt = ev.at + S.phone.skew * MIN;
  if (S.phone.online) apply(ev, false); else S.phone.queue.push(ev);
}
function feed(kind, text, jid, at) { S.feed.unshift({ at: at ?? S.now, kind, text, job: jid }); }
function addFlag(j, type, detail, at) { if (!j.flags.some(f => f.type === type && f.status === 'Open')) { j.flags.push({ type, detail, at, status:'Open' }); feed('risk', `<b>Integrity flag</b> · ${j.id} ${FLAGS[type].toLowerCase()}`, j.id); } }
function apply(ev, synced) {
  const j = job(ev.job); const off = !!synced;
  const tag = off ? ' · captured offline' : '';
  if (Math.abs(S.phone.skew) > S.config.drift && !S.phone.local[j.id].driftFlagged) {
    S.phone.local[j.id].driftFlagged = true;
    addFlag(j, 'CLOCK_DRIFT', `Phone clock ${S.phone.skew > 0 ? 'ahead' : 'behind'} by ${Math.abs(S.phone.skew)} min. Server time used for all events.`, ev.at);
  }
  switch (ev.type) {
    case 'trip.started': j.status = 'En route'; j.events.push({ type:ev.type, at:ev.at, label:'Trip started at ' + PICKUPS[j.pickup].split(' (')[0] + tag, offline:off }); break;
    case 'geofence.entered':

      j.events.push({ type:ev.type, at:ev.at, label:`Entered site geofence (${site(j).radius} m)${tag}`, offline:off });

      break;
    case 'arrival.confirmed': {

      if (ev.scan === 'Manual') addFlag(j, 'MANUAL_ENTRY', `Driver typed ${fmtCntr(j.container)} instead of scanning. Check digit valid.`, ev.at);
      const res = evaluate(j);
      feed(res === 'HIT' ? 'hit' : 'miss', `<b>Arrival confirmed · ${res}</b> · ${site(j).customer}, ${variance(j)}`, j.id, ev.at);
      feed('info', `<b>Notification sent</b> · SMS and email to ${site(j).customer} receiving and Sales Support`, j.id, ev.at);

      feed('risk', `<b>Delay pre-alert</b> · ${j.id} ${ev.code}, new ETA ${hm(ev.eta)}`, j.id, ev.at); break;
    case 'exception.filed':

      j.events.push({ type:ev.type, at:ev.at, label:`Exception ${ev.code} filed${tag}`, offline:off });
      feed('risk', `<b>Exception filed</b> · ${j.id} ${ev.code}, awaiting TMD review`, j.id, ev.at); break;
    case 'integrity.flagged': addFlag(j, ev.flag, ev.detail, ev.at); j.events.push({ type:ev.type, at:ev.at, label:'Integrity flag: ' + FLAGS[ev.flag], bad:true }); break;

function syncQueue() {
  const q = S.phone.queue; if (!q.length) return;
  S.phone.queue = [];
  for (const ev of q) {
    apply(ev, true);
    const j = job(ev.job);
    if (S.now - ev.at > S.config.lateSync * MIN) addFlag(j, 'LATE_SYNC', `Event captured ${hm(ev.at)}, synced ${hm(S.now)}.`, S.now);
  }
  const j = job(q[0].job);
  j.events.push({ type:'sync', at:S.now, label:`Synced ${q.length} queued event${q.length > 1 ? 's' : ''}` });
  feed('info', `<b>Offline events synced</b> · ${q.length} event${q.length > 1 ? 's' : ''} from ${trk(j).name}`, j.id);

/* ---------- simulated clock and driving ---------- */
function speedKmMin() { return (S.phone.traffic ? 10 : 30) / 60; }
function distanceKm(j) { const L = S.phone.local[j.id]; if (S.phone.mock && L.tripStart && !L.entry) return 0; return Math.max(0, j.d0 - L.travelled); }
function advance(ms) {
  const prev = S.now; S.now += ms;
  for (const j of S.jobs) {
    const L = S.phone.local[j.id];
    if (!L || !L.tripStart || L.entry) continue;
    const sp = speedKmMin(), can = sp * ms / MIN, need = j.d0 - L.travelled - site(j).radius / 1000;
    if (can >= need) {
      const at = prev + Math.max(0, need) / sp * MIN;
      L.travelled = Math.min(j.d0, L.travelled + can); L.entry = at;
      emit({ type:'geofence.entered', job:j.id, at, detail:'Automatic, no tap needed' });
      toast('Nandito ka na! Na-record ang oras: ' + hm12(at));
    } else L.travelled += can;
  }
  if (S.phone.online) for (const id in S.phone.local) { const L = S.phone.local[id]; if (L.tripStart) { L.seenKm = distanceKm(job(id)); L.seenAt = S.now; } }
}

const ACT = {
  view: v => { S.view = v; try { history.replaceState(null, '', '#' + v); } catch (_) {} window.scrollTo(0, 0); },
  openjob: id => { S.phone.jobId = id; S.phone.screen = job(id).demo && S.phone.local[id].confirmed ? 'result' : 'job'; },
  pscreen: s => { S.phone.screen = s; S.phone.scanErr = ''; S.phone.toast = null; if (s === 'exception' || s === 'delay') { S.phone.sel = null; S.drafts.remarks = ''; S.drafts.excphoto = false; S.drafts.shownote = false; } if (s === 'capture') { S.phone.manual = false; } },
  shownote: () => { S.drafts.shownote = true; },
  starttrip: id => { if (id) S.phone.jobId = id; S.phone.screen = 'job'; const j = job(S.phone.jobId), L = S.phone.local[j.id]; L.tripStart = S.now; emit({ type:'trip.started', job:j.id, at:S.now, detail:'Location tracking on for this job' }); if (S.phone.mock) mockFlag(j); },
  photo: () => { const L = S.phone.local[S.phone.jobId]; L.photo = S.now; plog('photo.captured', S.now, 'Camera, stamped with time and GPS'); },
  scan: () => { S.phone.local[S.phone.jobId].scan = 'QR'; ACT.submitarrival(); },
  showmanual: () => { S.phone.manual = true; },
  manual: () => {
    const j = job(S.phone.jobId), v = (S.drafts.manualno || '').toUpperCase().replace(/\s/g, '');
    if (!validCntr(v)) { S.phone.scanErr = 'Mali ang number. Tingnan ulit: 4 na letra at 7 numero.'; return; }
    if (v !== j.container) { S.phone.scanErr = 'Hindi ito ang container ng delivery na ito. Tingnan ang number sa pinto.'; return; }
    S.phone.scanErr = ''; S.phone.local[j.id].scan = 'Manual'; ACT.submitarrival();
  },
  submitarrival: () => {
    const j = job(S.phone.jobId), L = S.phone.local[j.id];
    L.confirmed = S.now;
    emit({ type:'arrival.confirmed', job:j.id, at:S.now, scan:L.scan, detail:`Photo + ${L.scan === 'QR' ? 'QR scan' : 'typed number'}` });
    S.phone.screen = 'result';
  },
  pickreason: c => { S.phone.sel = c; S.phone.scanErr = ''; },
  delaymin: n => { S.drafts.delaymin = +n; },
  excphoto: () => { S.drafts.excphoto = !S.drafts.excphoto; },
  fileexc: () => {
    const j = job(S.phone.jobId);
    if (S.phone.sel === 'OTH-99' && !(S.drafts.remarks || '').trim()) { S.phone.scanErr = 'Isulat kung ano ang nangyari.'; return; }
    S.phone.local[j.id].excQueued = { code:S.phone.sel };
    emit({ type:'exception.filed', job:j.id, at:S.now, code:S.phone.sel, remarks:(S.drafts.remarks || '').trim(), photo:!!S.drafts.excphoto, detail:S.phone.sel });
    S.phone.screen = 'result'; toast('Na-send na ang dahilan mo sa TMD.');
  },
  filedelay: () => {
    const j = job(S.phone.jobId);
    if (S.phone.sel === 'OTH-99' && !(S.drafts.remarks || '').trim()) { S.phone.scanErr = 'Isulat kung ano ang nangyari.'; return; }
    const mins = S.drafts.delaymin || 30;
    emit({ type:'delay.prealert', job:j.id, at:S.now, code:S.phone.sel, eta:j.agreed + mins * MIN, remarks:(S.drafts.remarks || '').trim(), detail:`${S.phone.sel}, +${mins} min` });
    S.phone.local[j.id].delayQueued = { code:S.phone.sel };
    S.phone.screen = 'job'; toast('Na-send na. Alam na ng TMD at Sales Support.');
  },
  ff: m => advance(+m * MIN),
  traffic: v => { S.phone.traffic = v === '1'; },
  online: v => { S.phone.online = v === '1'; if (S.phone.online) syncQueue(); },
  mock: () => { S.phone.mock = !S.phone.mock; if (S.phone.mock) for (const j of S.jobs) { const L = S.phone.local[j.id]; if (L && L.tripStart && !L.confirmed) mockFlag(j); } },
  skew: () => { S.phone.skew = S.phone.skew ? 0 : -30; },
  reset: () => { const keep = { view:S.view }; seed(); Object.assign(S, keep); },
  mapview: v => { S.mapView = v; },
  mapf: v => { S.mapf = v; },
  afreset: () => { S.af = { period:'mtd', site:'', haulier:'', trucker:'', move:'' }; },
  afset: kv => { const [k, v] = kv.split(':'); S.af[k] = v; window.scrollTo(0, 0); },
  pfill: k => {
    const A = S.auth.phone;
    if (A.stage === 'in' || A.stage === 'consent') ACT.plogout();
    A.stage = 'login'; A.err = '';
    const own = TRUCKERS[PHONE_OWNER].mobile;
    if (k === 'own') { S.drafts.pmobile = own; S.drafts.ppin = PINS[PHONE_OWNER]; }
    if (k === 'wrong') { S.drafts.pmobile = own; S.drafts.ppin = '111111'; }
    if (k === 'other') { S.drafts.pmobile = TRUCKERS.T04.mobile; S.drafts.ppin = PINS.T04; }
  },
  plogin: () => {
    const A = S.auth.phone, owner = TRUCKERS[PHONE_OWNER];
    if (A.lockUntil > S.now) { A.err = `Naka-lock muna ang login hanggang ${hm12(A.lockUntil)}. Tawagan ang TMD dispatcher kung kailangan.`; return; }
    const m = digits(S.drafts.pmobile), pin = digits(S.drafts.ppin);
    if (!m || pin.length !== 6) { A.err = 'Ilagay ang mobile number at 6-digit PIN.'; return; }
    const id = Object.keys(TRUCKERS).find(t => digits(TRUCKERS[t].mobile) === m);
    S.drafts.ppin = '';
    if (!id || PINS[id] !== pin) {
      A.fails++;
      if (A.fails >= MAX_FAILS) {
        A.lockUntil = S.now + LOCK_MIN * MIN; A.fails = 0;
        A.err = `Sobra na ang maling subok. Naka-lock hanggang ${hm12(A.lockUntil)}.`;
        logAudit(id ? TRUCKERS[id].name : 'Unknown number', 'TAS', 'Sign-in locked', `${MAX_FAILS} wrong PINs on ${owner.name}'s registered phone`);
        feed('risk', `<b>Trucker sign-in locked</b> · ${MAX_FAILS} wrong PINs on ${owner.name}'s phone`);
      } else A.err = `Mali ang mobile number o PIN. May ${MAX_FAILS - A.fails} pang subok.`;
      return;
    }
    if (id !== PHONE_OWNER) {
      A.err = 'Naka-register ang phone na ito sa ibang driver. Gamitin ang sarili mong phone.';
      logAudit(TRUCKERS[id].name, 'TAS', 'Blocked sign-in', `Correct PIN, but on ${owner.name}'s registered phone (${owner.device})`);
      feed('risk', `<b>Blocked sign-in</b> · ${TRUCKERS[id].name} tried to use ${owner.name}'s phone`);
      return;
    }
    A.fails = 0; A.err = ''; A.user = id; A.stage = A.consented ? 'in' : 'consent';
    logAudit(owner.name, 'TAS', 'Signed in', `${owner.device} · registered phone`);
  },
  pconsent: () => { const A = S.auth.phone; A.consented = true; A.stage = 'in'; logAudit(TRUCKERS[A.user].name, 'TAS', 'Accepted privacy notice', 'Location during active jobs, camera, data use'); },
  plogout: () => {
    const A = S.auth.phone;
    if (A.user) logAudit(TRUCKERS[A.user].name, 'TAS', 'Signed out', TRUCKERS[A.user].device);
    A.user = null; A.stage = 'login'; A.err = ''; S.phone.screen = 'list'; S.phone.jobId = null;
  },
  cclogin: () => {
    const A = S.auth.cc;
    if (A.lockUntil > S.now) { A.err = `This sign-in is locked until ${hm(A.lockUntil)} after too many wrong tries. Ask System Admin if you need access now.`; return; }
    const email = (S.drafts.ccemail || '').trim().toLowerCase(), pw = S.drafts.ccpw || '';
    if (!email || !pw) { A.err = 'Enter your work email and password.'; return; }
    const u = CC_USERS.find(x => x.email === email);
    S.drafts.ccpw = '';
    if (!u || u.pw !== pw) {
      A.fails++;
      logAudit(u ? u.name : email, 'Command Center', 'Failed sign-in', `Wrong email or password (${A.fails} of ${MAX_FAILS})`);
      if (A.fails >= MAX_FAILS) {
        A.lockUntil = S.now + LOCK_MIN * MIN; A.fails = 0;
        A.err = `Too many wrong tries. Sign-in is locked until ${hm(A.lockUntil)}.`;
        logAudit(u ? u.name : email, 'Command Center', 'Sign-in locked', `${MAX_FAILS} wrong tries, locked ${LOCK_MIN} min`);
      } else A.err = `Email or password is wrong. ${MAX_FAILS - A.fails} ${MAX_FAILS - A.fails === 1 ? 'try' : 'tries'} left.`;
      return;
    }
    A.err = '';
    if (u.mfa) { A.pending = u; A.stage = 'mfa'; S.drafts.ccotp = ''; return; }
    ccEnter(u);
  },
  ccmfa: () => {
    const A = S.auth.cc;
    if (digits(S.drafts.ccotp) !== A.pending.mfa) {
      A.err = 'That code is wrong or expired. Enter the current code from your authenticator app.'; S.drafts.ccotp = '';
      logAudit(A.pending.name, ROLES[A.pending.role], 'Failed 2-step code', 'Command Center');
      return;
    }
    ccEnter(A.pending);
  },
  cclogout: () => {
    const A = S.auth.cc;
    if (A.user) logAudit(A.user.name, ROLES[A.user.role], 'Signed out', 'Command Center');
    A.user = null; A.pending = null; A.err = ''; A.stage = 'login'; S.sel = null; S.page = 'board'; S.drafts.ccotp = '';
  },
  ccfill: email => { const u = CC_USERS.find(x => x.email === email); S.drafts.ccemail = u.email; S.drafts.ccpw = u.pw; S.auth.cc.err = ''; },
  showpw: () => { S.drafts.showpw = !S.drafts.showpw; },
  page: p => { S.page = p; S.sel = null; window.scrollTo(0, 0); },
  filter: f => { S.filter = f; },
  customer: v => { S.customer = v; },
  sel: id => { S.sel = id; S.drafts.revnote = ''; },
  close: () => { S.sel = null; },
  review: kind => {
    const j = job(S.sel), note = (S.drafts.revnote || '').trim();
    if (kind === 'Reject' && !note) { const e = document.getElementById('revnote'); e.placeholder = 'Add a note to explain the rejection'; e.focus(); return 'noop'; }
    Object.assign(j.exception, { status: kind === 'Reject' ? 'Rejected' : 'Validated', cls: kind === 'Reject' ? 'Controllable' : kind, reviewer:'TMD · ' + me().name, reviewNote: note || 'No note.', reviewedAt:S.now });
    j.events.push({ type:'exception.reviewed', at:S.now, label:`${j.exception.status} · ${j.exception.cls} by ${me().name}` });
    S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:`${j.exception.status} exception`, detail:`${j.id} · ${j.exception.code} → ${j.exception.cls}${note ? ' · ' + note : ''}` });
    feed('info', `<b>Exception ${j.exception.status.toLowerCase()}</b> · ${j.id} ${j.exception.code} → ${j.exception.cls}`, j.id);
    S.drafts.revnote = '';
  },
  clearflag: i => {
    const j = job(S.sel), f = j.flags[+i], note = (S.drafts['fnote-' + i] || '').trim();
    if (!note) { const e = document.getElementById('fnote-' + i); e.placeholder = 'Add a note first'; e.focus(); return 'noop'; }
    Object.assign(f, { status:'Cleared', clearedBy:me().name, note });
    S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Cleared integrity flag', detail:`${j.id} · ${f.type} · ${note}` });
    S.drafts['fnote-' + i] = '';
  },
  copy: () => {
    const txt = document.getElementById('copytext').textContent, out = document.getElementById('copied');
    const done = m => { out.textContent = m; };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('copytext')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Text selected. Press Ctrl+C to copy.'); };
    try { navigator.clipboard.writeText(txt).then(() => done('Copied.'), sel); } catch (_) { sel(); }
    return 'noop';
  },
  cfgtoggle: id => { S.config[id] = !S.config[id]; S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Changed rule', detail:`${id} → ${S.config[id] ? 'On' : 'Off'}` }); },
  resetdev: id => { S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Reset device binding', detail:`${TRUCKERS[id].name} · next login binds a new phone` }); TRUCKERS[id].device = 'Not bound · waiting for login'; TRUCKERS[id].bound = '—'; },
};
function mockFlag(j) {

  const el = e.target;
  if (el.dataset.act === 'customer') { ACT[el.dataset.act](el.value); render(); }
  if (el.dataset.af) { S.af[el.dataset.af] = el.value; if (el.dataset.af === 'haulier' && S.af.trucker && TRUCKERS[S.af.trucker].haulier !== el.value && el.value) S.af.trucker = ''; render(); }
  if (el.dataset.cfg) {
    const k = el.dataset.cfg, old = S.config[k], v = Math.max(+el.min, Math.min(+el.max, Math.round(+el.value || 0)));
    if (v !== old) { S.config[k] = v; S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Changed rule', detail:`${k}: ${old} → ${v}` }); }
    render();
  }
  if (el.dataset.rad) {
    const s = SITES[el.dataset.rad], old = s.radius, v = Math.max(50, Math.min(500, Math.round(+el.value || old)));
    if (v !== old) { s.radius = v; S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Changed geofence', detail:`${s.customer}: ${old} m → ${v} m` }); }
    render();
  }
});
document.addEventListener('submit', e => { const f = e.target.dataset.form; if (!f) return; e.preventDefault(); ACT[f](); render(); });
document.addEventListener('input', e => { const d = e.target.dataset.draft; if (d) S.drafts[d] = e.target.value; });

const h = (location.hash || '').slice(1);
if (['trucker', 'command', 'spec'].includes(h)) S.view = h;
render();
setInterval(tick, 1000);
</script>
