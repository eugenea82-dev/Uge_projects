<title>Trucker Visibility Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: top bar switches three views. Trucker = phone + demo rail. Command Center = role nav + board/drawer. How it works = rules reference. */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --sunk:#EEECF3; --ink:#1C1827; --muted:#665F75; --line:#E0DCE8;
  --magenta:#C1006C; --violet:#5A2BC2; --on-accent:#FFFFFF;
  --hit:#0D7650; --hit-bg:#E1F4EA; --miss:#BC2329; --miss-bg:#FBE6E6; --risk:#965800; --risk-bg:#FFF0D2;
  --info:#2E58CC; --info-bg:#E5EBFB; --neutral-bg:#ECEAF1;
  --bezel:#17141E; --view:#0E0C12;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(28,24,39,.06),0 8px 24px rgba(28,24,39,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F16; --surface:#1A1722; --sunk:#14121B; --ink:#ECE9F3; --muted:#A49DB3; --line:#2D2938;
  --magenta:#FF55AA; --violet:#A887FF; --on-accent:#14111B;
  --hit:#4AD49E; --hit-bg:#0F2A20; --miss:#FF7C7C; --miss-bg:#36171A; --risk:#F3B64A; --risk-bg:#30250F;
  --info:#86A6FF; --info-bg:#182143; --neutral-bg:#26222F;
  --bezel:#000000; --view:#08070B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F16; --surface:#1A1722; --sunk:#14121B; --ink:#ECE9F3; --muted:#A49DB3; --line:#2D2938;
  --magenta:#FF55AA; --violet:#A887FF; --on-accent:#14111B;
  --hit:#4AD49E; --hit-bg:#0F2A20; --miss:#FF7C7C; --miss-bg:#36171A; --risk:#F3B64A; --risk-bg:#30250F;
  --info:#86A6FF; --info-bg:#182143; --neutral-bg:#26222F;
  --bezel:#000000; --view:#08070B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted)}

/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--magenta),var(--violet));display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;line-height:1;display:block}
.brand small{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.clock .mono{font-size:15px;font-weight:600}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--hit);box-shadow:0 0 0 3px var(--hit-bg)}
.sample{font-size:12px;background:var(--risk-bg);color:var(--risk);padding:2px 8px;border-radius:99px;font-weight:600}

.wrap{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;font-family:var(--f-display);text-transform:uppercase}
.c-hit{background:var(--hit-bg);color:var(--hit)} .c-miss{background:var(--miss-bg);color:var(--miss)}
.c-risk{background:var(--risk-bg);color:var(--risk)} .c-info{background:var(--info-bg);color:var(--info)}
.c-neutral{background:var(--neutral-bg);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:var(--on-accent)}
.btn.ok{background:var(--hit);border-color:var(--hit);color:var(--on-accent)}
.btn.bad{color:var(--miss);border-color:var(--miss)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============ TRUCKER VIEW ============ */
.trucker{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.phone{width:372px;max-width:100%;background:var(--bezel);border-radius:44px;padding:12px;box-shadow:0 30px 60px -20px rgba(20,10,40,.45)}
.screen{background:#F4F3F7;color:#16131E;border-radius:34px;overflow:hidden;height:760px;max-height:calc(100vh - 140px);min-height:600px;display:flex;flex-direction:column;position:relative;
  --p-ink:#16131E;--p-muted:#5E5870;--p-line:#DDD9E5;--p-card:#FFFFFF;--p-accent:#B8005F;--p-hit:#0B6E49;--p-miss:#B3141B;--p-risk:#8A4F00}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 6px;font-size:13px;font-weight:600;background:#FFFFFF}
.sbar .ic{display:flex;gap:6px;align-items:center}
.appbar{background:#FFFFFF;padding:6px 16px 12px;border-bottom:1px solid var(--p-line);display:flex;align-items:center;gap:10px}
.appbar h2{font-size:22px;color:var(--p-ink)}
.appbar .back{border:0;background:#EEEBF3;width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--p-ink);flex:none}
.pbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.offline-bar{background:#2A2533;color:#FFFFFF;font-size:13px;padding:7px 14px}
.offline-bar b{color:#FFC94D}
.pcard{background:var(--p-card);border-radius:16px;padding:14px;border:1px solid var(--p-line);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
button.pcard:hover{border-color:var(--p-accent)}
.pcard .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big-time{font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--p-ink);line-height:1}
.pk{font-size:12px;color:var(--p-muted)}
.pv{font-weight:600;color:var(--p-ink)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--p-muted)} .kv dd{margin:0;font-weight:600;color:var(--p-ink);min-width:0;overflow-wrap:anywhere}
.pbtn{width:100%;min-height:56px;border-radius:14px;border:0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--p-accent);color:#FFFFFF}
.pbtn.alt{background:#FFFFFF;color:var(--p-ink);border:2px solid var(--p-line)}
.pbtn.go{background:var(--p-hit)}
.pbtn:disabled{background:#CFCBD8;color:#7A748A}
.pbtn small{display:block;font-family:var(--f-body);text-transform:none;font-size:12px;font-weight:500;letter-spacing:0;opacity:.85}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ck{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:#FFFFFF}
.ck.y{background:var(--p-hit)} .ck.n{background:var(--p-miss)} .ck.w{background:var(--p-risk)} .ck.p{background:#B9B4C4}
.checks small{display:block;color:var(--p-muted);font-size:12px}
.dist{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1;color:var(--p-ink)}
.track{height:8px;border-radius:99px;background:#E6E2EC;overflow:hidden}
.track i{display:block;height:100%;background:var(--p-accent);border-radius:99px}
.note{font-size:12px;color:var(--p-muted);display:flex;gap:6px;align-items:flex-start}
.finder{background:#0C0B10;border-radius:16px;aspect-ratio:4/3;position:relative;overflow:hidden;display:grid;place-items:center;max-width:100%}
.finder svg{width:100%;height:100%;display:block}
.qrframe{position:absolute;inset:22% 28%;border:3px solid #FFFFFF;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.scanline{position:absolute;left:28%;right:28%;height:2px;background:#FF4FA3;top:50%;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:24%}to{top:76%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none}}
.shutter{width:68px;height:68px;border-radius:50%;border:5px solid #FFFFFF;background:var(--p-accent);margin:0 auto;display:block}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:99px;background:#DDD9E5}
.steps span.on{background:var(--p-accent)}
.result{border-radius:20px;padding:22px 16px;text-align:center;color:#FFFFFF;display:flex;flex-direction:column;gap:6px;align-items:center}
.result.hit{background:var(--p-hit)} .result.miss{background:var(--p-miss)}
.result h3{font-size:52px;line-height:1}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;border:2px solid var(--p-line);background:#FFFFFF;text-align:left;width:100%;color:var(--p-ink)}
.opt[aria-pressed="true"]{border-color:var(--p-accent);background:#FFF0F7}
.opt .code{font-family:var(--f-mono);font-size:12px;color:var(--p-muted);min-width:54px}
.ptxt{width:100%;border:2px solid var(--p-line);border-radius:12px;padding:10px;background:#FFFFFF;color:var(--p-ink);min-height:70px}
.pinput{width:100%;border:2px solid var(--p-line);border-radius:12px;padding:12px;background:#FFFFFF;color:var(--p-ink);font-family:var(--f-mono);font-size:16px;text-transform:uppercase}
.err{color:var(--p-miss);font-size:13px;font-weight:600}
.toast{position:absolute;left:12px;right:12px;bottom:14px;background:#1E1A27;color:#FFFFFF;border-radius:12px;padding:10px 14px;font-size:13px;z-index:5}
.pchip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.pc-hit{background:#DDF3E8;color:var(--p-hit)} .pc-miss{background:#FBE3E4;color:var(--p-miss)} .pc-risk{background:#FFEFCF;color:var(--p-risk)} .pc-n{background:#ECE9F1;color:#5E5870} .pc-info{background:#E3E9FB;color:#2B50B8}

.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:19px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ctrl{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--sunk)}
.ctrl .lbl{font-weight:600;font-size:14px}
.ctrl p{margin:0;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:7px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cheat[aria-pressed="true"]{background:var(--miss)!important;border-color:var(--miss)!important;color:var(--on-accent)!important}
.evlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.evlog li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.evlog code{font-family:var(--f-mono);font-size:12px;color:var(--violet)}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* ============ COMMAND CENTER ============ */
.cc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px}
.role{display:flex;flex-direction:column;gap:6px}
.role select{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.navlist button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.navlist .n{font-family:var(--f-mono);font-size:12px;background:var(--miss-bg);color:var(--miss);border-radius:99px;padding:0 7px}
.navgroup{font-size:11px;padding:8px 12px 2px}
.perm{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:9px;padding:10px;line-height:1.4}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.head h2{font-size:30px;line-height:1.05}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;position:relative;overflow:hidden}
button.kpi:hover{border-color:var(--muted)}
.kpi[aria-pressed="true"]{border-color:var(--ink)}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.k-hit .v{color:var(--hit)} .kpi.k-miss .v{color:var(--miss)} .kpi.k-risk .v{color:var(--risk)}
.kpi.k-miss::before,.kpi.k-risk::before,.kpi.k-hit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.k-miss::before{background:var(--miss)} .kpi.k-risk::before{background:var(--risk)} .kpi.k-hit::before{background:var(--hit)}
.boardgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1560px){.boardgrid{grid-template-columns:minmax(0,1fr) 300px}}
.board-table{min-width:1000px}
.board-table td.nw{white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters select{padding:5px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--sunk)}
td .sub{font-size:12px;color:var(--muted)}
.var-pos{color:var(--miss);font-weight:600} .var-neg{color:var(--hit);font-weight:600}
.icons{display:flex;gap:4px;flex-wrap:wrap}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:560px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.feed .k-hit b{color:var(--hit)} .feed .k-miss b{color:var(--miss)} .feed .k-risk b{color:var(--risk)} .feed .k-info b{color:var(--info)}
button.linkish{border:0;background:none;padding:0;color:var(--violet);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:2px}

.drawer-bg{position:fixed;inset:0;background:rgba(14,10,22,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h2{font-size:26px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:14px}
.facts div{display:flex;flex-direction:column;min-width:0}
.facts .k{font-size:12px;color:var(--muted)} .facts .v{font-weight:600;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.figure{border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.figure svg{width:100%;height:100%;display:block}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{display:grid;grid-template-columns:52px 16px minmax(0,1fr);gap:8px;padding-bottom:12px;font-size:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:67px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--violet);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--violet)}
.timeline .dot.off{background:var(--risk);box-shadow:0 0 0 1px var(--risk)}
.timeline .dot.bad{background:var(--miss);box-shadow:0 0 0 1px var(--miss)}
.timeline small{display:block;color:var(--muted);font-size:12px}
.flag{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-left:4px solid var(--miss);border-radius:8px;padding:10px 12px;background:var(--surface)}
.flag.cleared{border-left-color:var(--muted);opacity:.75}
.flag .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
textarea.in,input.in,select.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.copybox{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:10px;white-space:pre-wrap;user-select:all}

.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chart svg{width:100%;height:auto;display:block}
.chart .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chart .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.pareto{display:flex;flex-direction:column;gap:8px}
.pareto .r{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}

.field{display:flex;flex-direction:column;gap:4px}

.spec{display:flex;flex-direction:column;gap:22px}
.lede{max-width:70ch;font-size:16px;margin:0}
.fw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fw .step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fw .num{font-family:var(--f-display);font-weight:700;font-size:15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--on-accent);background:var(--magenta)}
.fw .step:nth-child(2) .num{background:var(--violet)}
.fw .step:nth-child(3) .num{background:var(--info)}
.fw .step:nth-child(4) .num{background:var(--violet)}
.fw ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fw .who{font-size:12px;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.rule .formula{font-family:var(--f-mono);font-size:14px;background:var(--sunk);padding:10px 12px;border-radius:8px}
pre.payload{margin:0;font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:10px;padding:14px;overflow-x:auto;line-height:1.5}

/* ---------- Hit / Miss engine ---------- */
function evaluate(j) {
  const due = j.agreed + S.config.grace * MIN;
  if (j.arrival) return j.arrival.at <= due ? 'HIT' : 'MISS';
  if (S.now > due) return 'MISS_NA';
  if (j.agreed - S.now <= S.config.atRisk * MIN) return 'AT_RISK';
  return 'ON_SCHEDULE';
}
const RESULT_CHIP = {
  HIT:['c-hit','Hit'], MISS:['c-miss','Miss'], MISS_NA:['c-miss','Miss · not arrived'], AT_RISK:['c-risk','At risk'], ON_SCHEDULE:['c-neutral','On schedule'],
};
const resultChip = j => { const [c, t] = RESULT_CHIP[evaluate(j)]; const early = j.arrival && j.arrival.at < j.agreed - 15 * MIN ? ' <span class="chip c-info">Early</span>' : ''; return `<span class="chip ${c}">${t}</span>${early}`; };
function kpis() {
  const r = S.jobs.map(j => ({ j, e: evaluate(j) }));
  const hits = r.filter(x => x.e === 'HIT').length;
  const misses = r.filter(x => x.e === 'MISS' || x.e === 'MISS_NA');
  const decided = hits + misses.length;
  const excused = misses.filter(x => x.j.exception && x.j.exception.status === 'Validated' && x.j.exception.cls === 'Uncontrollable').length;
  const missArrived = misses.filter(x => x.e === 'MISS');
  return {
    total: S.jobs.length, arrived: S.jobs.filter(j => j.arrival).length, hits, misses: misses.length, decided,
    raw: decided ? Math.round(hits / decided * 100) : null,
    adj: decided - excused ? Math.round(hits / (decided - excused) * 100) : null,
    risk: r.filter(x => x.e === 'AT_RISK').length,
    pend: S.jobs.filter(j => j.exception && j.exception.status === 'Pending').length,
    flags: S.jobs.reduce((n, j) => n + j.flags.filter(f => f.status === 'Open').length, 0),
    noExc: missArrived.filter(x => !x.j.exception).length,
    notArrived: misses.filter(x => x.e === 'MISS_NA').length,
  };
}

/* ---------- phone → platform events ---------- */
function plog(type, at, detail) { S.phone.log.unshift({ type, at, detail, queued: !S.phone.online }); }
function emit(ev) {
  plog(ev.type, ev.at, ev.detail || '');
  ev.deviceAt = ev.at + S.phone.skew * MIN;
  if (S.phone.online) apply(ev, false); else S.phone.queue.push(ev);
}
function feed(kind, text, jid, at) { S.feed.unshift({ at: at ?? S.now, kind, text, job: jid }); }
function addFlag(j, type, detail, at) { if (!j.flags.some(f => f.type === type && f.status === 'Open')) { j.flags.push({ type, detail, at, status:'Open' }); feed('risk', `<b>Integrity flag</b> · ${j.id} ${FLAGS[type].toLowerCase()}`, j.id); } }
function apply(ev, synced) {
  const j = job(ev.job); const off = !!synced;
  const tag = off ? ' · captured offline' : '';
  if (Math.abs(S.phone.skew) > S.config.drift && !S.phone.local[j.id].driftFlagged) {
    S.phone.local[j.id].driftFlagged = true;
    addFlag(j, 'CLOCK_DRIFT', `Phone clock ${S.phone.skew > 0 ? 'ahead' : 'behind'} by ${Math.abs(S.phone.skew)} min. Server time used for all events.`, ev.at);
  }
  switch (ev.type) {
    case 'trip.started': j.status = 'En route'; j.events.push({ type:ev.type, at:ev.at, label:'Trip started at ' + PICKUPS[j.pickup].split(' (')[0] + tag, offline:off }); break;
    case 'geofence.entered':
      j.arrival = { at: ev.at, acc: 12, offline: off }; j.status = 'At site';
      j.events.push({ type:ev.type, at:ev.at, label:`Entered site geofence (${site(j).radius} m)${tag}`, offline:off });
      feed(evaluate(j) === 'HIT' ? 'hit' : 'miss', `<b>Truck at site · ${evaluate(j) === 'HIT' ? 'HIT' : 'MISS'}</b> · ${site(j).customer}, ${variance(j)}`, j.id, ev.at);
      break;
    case 'arrival.confirmed': {
      j.confirmedAt = ev.at; j.status = 'Confirmed'; j.photo = true; j.scan = ev.scan;
      j.events.push({ type:ev.type, at:ev.at, label:`Confirmed with photo + ${ev.scan === 'QR' ? 'QR scan' : 'typed container no.'}${tag}`, offline:off });
      if (ev.scan === 'Manual') addFlag(j, 'MANUAL_ENTRY', `Driver typed ${fmtCntr(j.container)} instead of scanning. Check digit valid.`, ev.at);
      const res = evaluate(j);
      feed(res === 'HIT' ? 'hit' : 'miss', `<b>Arrival confirmed · ${res}</b> · ${site(j).customer}, ${variance(j)}`, j.id, ev.at);
      feed('info', `<b>Notification sent</b> · SMS and email to ${site(j).customer} receiving and Sales Support`, j.id, ev.at);
      S.lastPayload = payload(j, off);
      break; }
    case 'delay.prealert':
      j.prealert = { code: ev.code, eta: ev.eta, at: ev.at, remarks: ev.remarks };
      j.events.push({ type:ev.type, at:ev.at, label:`Delay pre-alert ${ev.code}, new ETA ${hm(ev.eta)}${tag}`, offline:off });
      feed('risk', `<b>Delay pre-alert</b> · ${j.id} ${ev.code}, new ETA ${hm(ev.eta)}`, j.id, ev.at); break;
    case 'exception.filed':
      j.exception = { code: ev.code, remarks: ev.remarks, filedAt: ev.at, status:'Pending', photo: ev.photo };
      j.events.push({ type:ev.type, at:ev.at, label:`Exception ${ev.code} filed${tag}`, offline:off });
      feed('risk', `<b>Exception filed</b> · ${j.id} ${ev.code}, awaiting TMD review`, j.id, ev.at); break;
    case 'integrity.flagged': addFlag(j, ev.flag, ev.detail, ev.at); j.events.push({ type:ev.type, at:ev.at, label:'Integrity flag: ' + FLAGS[ev.flag], bad:true }); break;
  }
}
function syncQueue() {
  const q = S.phone.queue; if (!q.length) return;
  S.phone.queue = [];
  for (const ev of q) {
    apply(ev, true);
    const j = job(ev.job);
    if (S.now - ev.at > S.config.lateSync * MIN) addFlag(j, 'LATE_SYNC', `Event captured ${hm(ev.at)}, synced ${hm(S.now)}.`, S.now);
  }
  const j = job(q[0].job);
  j.events.push({ type:'sync', at:S.now, label:`Synced ${q.length} queued event${q.length > 1 ? 's' : ''}` });
  feed('info', `<b>Offline events synced</b> · ${q.length} event${q.length > 1 ? 's' : ''} from ${trk(j).name}`, j.id);
  for (const l of S.phone.log) l.queued = false;
}
function variance(j) {
  if (!j.arrival) return '';
  const { m, txt } = relMin(j.arrival.at - j.agreed);

}
function payload(j, offline) {
  return {
    event:'arrival.confirmed', event_id:'evt_' + j.id.slice(-4) + (j.confirmedAt % 100000).toString(36).toUpperCase(),
    job_id:j.id, booking_ref:j.booking, container_no:j.container, stop:'customer',

    result:evaluate(j), variance_min:Math.round((j.arrival.at - j.agreed) / MIN),
    location:{ lat:site(j).lat, lng:site(j).lng, accuracy_m:j.arrival.acc },

}

/* ---------- simulated clock and driving ---------- */
function speedKmMin() { return (S.phone.traffic ? 10 : 30) / 60; }
function distanceKm(j) { const L = S.phone.local[j.id]; if (S.phone.mock && L.tripStart && !L.entry) return 0; return Math.max(0, j.d0 - L.travelled); }
function advance(ms) {
  const prev = S.now; S.now += ms;
  for (const j of S.jobs) {
    const L = S.phone.local[j.id];
    if (!L || !L.tripStart || L.entry) continue;
    const sp = speedKmMin(), can = sp * ms / MIN, need = j.d0 - L.travelled - site(j).radius / 1000;
    if (can >= need) {
      const at = prev + Math.max(0, need) / sp * MIN;
      L.travelled = Math.min(j.d0, L.travelled + can); L.entry = at;
      emit({ type:'geofence.entered', job:j.id, at, detail:'Automatic, no tap needed' });
      toast('You are at the customer site. Arrival time recorded: ' + hm(at));
    } else L.travelled += can;
  }
}
let lastSig = '';
function tick() {
  const before = phoneSig();

  const sig = S.jobs.map(evaluate).join() + phoneSig();
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = hms(S.now));
  document.querySelectorAll('[data-dclock]').forEach(el => el.textContent = hm(S.now + S.phone.skew * MIN));
  if (sig !== lastSig || before !== phoneSig()) { lastSig = sig; render(); return; }
  document.querySelectorAll('[data-cd]').forEach(el => el.textContent = countdown(+el.dataset.cd));
  document.querySelectorAll('[data-dist]').forEach(el => { const j = job(el.dataset.dist); el.textContent = distanceKm(j).toFixed(1) + ' km'; });
  document.querySelectorAll('[data-prog]').forEach(el => { const j = job(el.dataset.prog); el.style.width = Math.min(100, (1 - distanceKm(j) / j.d0) * 100) + '%'; });
}
const phoneSig = () => Object.values(S.phone.local).map(l => (l.entry || 0)).join();
function countdown(agreed) { const { m, txt } = relMin(agreed - S.now); return m >= 0 ? `in ${txt}` : `${txt} past agreed time`; }

    ['Use a fake GPS app','Mock-location detection and Play Integrity check. Confirmation blocked','MOCK_LOCATION'],

    ['Tap late to hide a late arrival, or tap early','Arrival time = geofence entry, recorded automatically','No effect'],
    ['Upload an old photo','Camera only, photo stamped and hashed','PHOTO_REUSED'],
    ['Scan a QR photo sent by another driver','Scan must match this job\'s container and only counts inside the geofence','CONTAINER_MISMATCH'],
    ['Type the container number','Allowed for damaged labels, always flagged','MANUAL_ENTRY'],
    ['Stay offline to hide the time','Arrival still recorded offline with true time. Late sync flagged','LATE_SYNC'],
    ['Lend phone or login to another driver','One phone per trucker, SMS PIN login, Admin-only reset','DEVICE_CHANGE'],
  ];
  return `<div class="spec">
    <div><span class="eyebrow">Version 2 design</span><h2 style="font-size:34px">How it works</h2></div>
    <p class="lede">The trucker's phone records the arrival automatically when the truck enters the customer's site area, using server time. The trucker then proves it with a live photo and a container scan. The Command Center compares that time with the time agreed at booking and marks the job Hit or Miss.</p>
    <div class="fw">
      <div class="step"><span class="num">1</span><h3>Capture</h3><ul><li>Live photo, camera only</li><li>Container QR scan, ISO 6346 check digit</li><li>GPS with accuracy</li><li>Server-trusted time</li><li>Works offline</li></ul><span class="who">Trucker · own smartphone</span></div>
      <div class="step"><span class="num">2</span><h3>Arrival confirmation</h3><ul><li>Location: geofence per customer site</li><li>Time: compared with agreed time → Hit / Miss</li><li>Notifications to TMD, Sales Support and customer</li><li>Exception required on every Miss</li></ul><span class="who">System · Branch Ops · Customer</span></div>
      <div class="step"><span class="num">3</span><h3>Integrate</h3><ul><li>Jobs imported from TMD-Haulage</li><li>Arrival events sent back by API webhook</li><li>No re-encoding by dispatch or sales</li></ul><span class="who">IT</span></div>
      <div class="step"><span class="num">4</span><h3>Govern</h3><ul><li>KPIs: raw and adjusted Hit rate</li><li>Exceptions and integrity flags reviewed by TMD</li><li>Audit trail of every change</li><li>Data privacy: tracking only during active jobs</li></ul><span class="who">BPA · DPO</span></div>
    </div>
    <section class="rule"><div><span class="eyebrow">The rule</span><h3 style="font-size:22px">Hit or Miss</h3></div>
      <div class="formula">HIT  if arrival ≤ agreed + grace (${S.config.grace} min)<br>MISS if arrival &gt; agreed + grace<br>MISS if not arrived and agreed time has passed</div>
      <div style="font-size:14px">Arrival = first entry into the site geofence, timed by the server. Exceptions explain a Miss. They never turn it into a Hit. Validated uncontrollable misses are left out of the <b>adjusted</b> rate only.</div></section>
    <section class="panel"><div><span class="eyebrow">Integrity</span><h3>How each workaround is stopped</h3></div><div class="tablebox" style="border:0"><table><thead><tr><th>If a trucker tries to…</th><th>The platform…</th><th>TMD sees</th></tr></thead><tbody>
      ${anti.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${c.includes('_') ? `<span class="chip c-miss">${c}</span>` : `<span class="chip c-neutral">${c}</span>`}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><div><span class="eyebrow">Access</span><h3>Sign-in for both apps</h3></div><div class="tablebox" style="border:0"><table><thead><tr><th></th><th>Trucker app</th><th>Command Center</th></tr></thead><tbody>
      <tr><td><b>Splash</b></td><td>Brand screen while the app checks phone security (rooted phone, fake GPS, app version)</td><td>Brand screen while the session loads</td></tr>
      <tr><td><b>Credentials</b></td><td>Mobile number + 6-digit PIN</td><td>Work email + password</td></tr>
      <tr><td><b>Extra check</b></td><td>Phone must be the driver's registered phone. Other drivers are blocked and flagged</td><td>System Admin also enters a 6-digit authenticator code</td></tr>
      <tr><td><b>Wrong tries</b></td><td colspan="2">5 wrong tries lock sign-in for 15 min. Logged in the audit trail</td></tr>
      <tr><td><b>Role</b></td><td>Trucker sees only own jobs</td><td>Role comes from the account (TMD Team, Sales Support or System Admin), not chosen at sign-in</td></tr>
      <tr><td><b>First sign-in</b></td><td>Privacy consent for location, camera and data use (RA 10173)</td><td>Password reset link from System Admin</td></tr>
    </tbody></table></div></section>
    <section class="panel"><div><span class="eyebrow">Integrate</span><h3>Event sent to TMD-Haulage and customers</h3><p class="muted" style="margin:4px 0 0;font-size:13px">${S.lastPayload ? 'This is the payload from your demo confirmation.' : 'Sample from job HJ-2610-0411. Confirm an arrival in the Trucker app to see your own.'}</p></div>
      <pre class="payload">${esc(JSON.stringify(p, null, 2))}</pre></section>
  </div>`;
}

/* ============ ACTIONS ============ */
const ACT = {
  view: v => { S.view = v; try { history.replaceState(null, '', '#' + v); } catch (_) {} window.scrollTo(0, 0); },
  openjob: id => { S.phone.jobId = id; S.phone.screen = job(id).demo && S.phone.local[id].confirmed ? 'result' : 'job'; },
  pscreen: s => { S.phone.screen = s; S.phone.scanErr = ''; if (s === 'exception' || s === 'delay') { S.phone.sel = null; S.drafts.remarks = ''; S.drafts.excphoto = false; } if (s === 'capture') { S.phone.manual = false; } },
  starttrip: () => { const j = job(S.phone.jobId), L = S.phone.local[j.id]; L.tripStart = S.now; emit({ type:'trip.started', job:j.id, at:S.now, detail:'Location tracking on for this job' }); if (S.phone.mock) mockFlag(j); },
  photo: () => { const L = S.phone.local[S.phone.jobId]; L.photo = S.now; plog('photo.captured', S.now, 'Camera, stamped with time and GPS'); },
  scan: () => { const L = S.phone.local[S.phone.jobId]; L.scan = 'QR'; },
  showmanual: () => { S.phone.manual = true; },
  manual: () => {
    const j = job(S.phone.jobId), v = (S.drafts.manualno || '').toUpperCase().replace(/\s/g, '');
    if (!validCntr(v)) { S.phone.scanErr = 'This is not a valid container number. Check the 4 letters, 6 digits and the last check digit.'; return; }
    if (v !== j.container) { S.phone.scanErr = 'This container is not on this job. Check the number on the door.'; return; }
    S.phone.scanErr = ''; S.phone.local[j.id].scan = 'Manual';
  },
  submitarrival: () => {
    const j = job(S.phone.jobId), L = S.phone.local[j.id];
    L.confirmed = S.now;
    emit({ type:'arrival.confirmed', job:j.id, at:S.now, scan:L.scan, detail:`Photo + ${L.scan === 'QR' ? 'QR scan' : 'typed number'}` });
    S.phone.screen = 'result';
  },
  pickreason: c => { S.phone.sel = c; S.phone.scanErr = ''; },
  delaymin: n => { S.drafts.delaymin = +n; },
  excphoto: () => { S.drafts.excphoto = !S.drafts.excphoto; },
  fileexc: () => {
    const j = job(S.phone.jobId);
    if (S.phone.sel === 'OTH-99' && !(S.drafts.remarks || '').trim()) { S.phone.scanErr = 'Add remarks for "Other".'; return; }
    S.phone.local[j.id].excQueued = { code:S.phone.sel };
    emit({ type:'exception.filed', job:j.id, at:S.now, code:S.phone.sel, remarks:(S.drafts.remarks || '').trim(), photo:!!S.drafts.excphoto, detail:S.phone.sel });
    S.phone.screen = 'result'; toast('Exception sent to TMD for review.');
  },
  filedelay: () => {
    const j = job(S.phone.jobId);
    if (S.phone.sel === 'OTH-99' && !(S.drafts.remarks || '').trim()) { S.phone.scanErr = 'Add remarks for "Other".'; return; }
    const mins = S.drafts.delaymin || 30;
    emit({ type:'delay.prealert', job:j.id, at:S.now, code:S.phone.sel, eta:j.agreed + mins * MIN, remarks:(S.drafts.remarks || '').trim(), detail:`${S.phone.sel}, +${mins} min` });
    S.phone.screen = 'job'; toast('Delay alert sent. TMD and Sales Support have been told.');
  },
  ff: m => advance(+m * MIN),
  traffic: v => { S.phone.traffic = v === '1'; },
  online: v => { S.phone.online = v === '1'; if (S.phone.online) syncQueue(); },
  mock: () => { S.phone.mock = !S.phone.mock; if (S.phone.mock) for (const j of S.jobs) { const L = S.phone.local[j.id]; if (L && L.tripStart && !L.confirmed) mockFlag(j); } },
  skew: () => { S.phone.skew = S.phone.skew ? 0 : -30; },
  reset: () => { const keep = { view:S.view }; seed(); Object.assign(S, keep); },
  pfill: k => {
    const A = S.auth.phone;
    if (A.stage === 'in' || A.stage === 'consent') ACT.plogout();
    A.stage = 'login'; A.err = '';
    const own = TRUCKERS[PHONE_OWNER].mobile;
    if (k === 'own') { S.drafts.pmobile = own; S.drafts.ppin = PINS[PHONE_OWNER]; }
    if (k === 'wrong') { S.drafts.pmobile = own; S.drafts.ppin = '111111'; }
    if (k === 'other') { S.drafts.pmobile = TRUCKERS.T04.mobile; S.drafts.ppin = PINS.T04; }
  },
  plogin: () => {
    const A = S.auth.phone, owner = TRUCKERS[PHONE_OWNER];
    if (A.lockUntil > S.now) { A.err = `Sign-in is locked until ${hm(A.lockUntil)} after too many wrong PINs. Call TMD dispatch if you need help now.`; return; }
    const m = digits(S.drafts.pmobile), pin = digits(S.drafts.ppin);
    if (!m || pin.length !== 6) { A.err = 'Enter your mobile number and your 6-digit PIN.'; return; }
    const id = Object.keys(TRUCKERS).find(t => digits(TRUCKERS[t].mobile) === m);
    S.drafts.ppin = '';
    if (!id || PINS[id] !== pin) {
      A.fails++;
      if (A.fails >= MAX_FAILS) {
        A.lockUntil = S.now + LOCK_MIN * MIN; A.fails = 0;
        A.err = `Too many wrong tries. Sign-in is locked until ${hm(A.lockUntil)}.`;
        logAudit(id ? TRUCKERS[id].name : 'Unknown number', 'Trucker app', 'Sign-in locked', `${MAX_FAILS} wrong PINs on ${owner.name}'s registered phone`);
        feed('risk', `<b>Trucker sign-in locked</b> · ${MAX_FAILS} wrong PINs on ${owner.name}'s phone`);
      } else A.err = `Mobile number or PIN is wrong. ${MAX_FAILS - A.fails} ${MAX_FAILS - A.fails === 1 ? 'try' : 'tries'} left.`;
      return;
    }
    if (id !== PHONE_OWNER) {
      A.err = 'This phone is registered to another driver. Sign in on your own phone, or ask System Admin to move your account.';
      logAudit(TRUCKERS[id].name, 'Trucker app', 'Blocked sign-in', `Correct PIN, but on ${owner.name}'s registered phone (${owner.device})`);
      feed('risk', `<b>Blocked sign-in</b> · ${TRUCKERS[id].name} tried to use ${owner.name}'s phone`);
      return;
    }
    A.fails = 0; A.err = ''; A.user = id; A.stage = A.consented ? 'in' : 'consent';
    logAudit(owner.name, 'Trucker app', 'Signed in', `${owner.device} · registered phone`);
  },
  pconsent: () => { const A = S.auth.phone; A.consented = true; A.stage = 'in'; logAudit(TRUCKERS[A.user].name, 'Trucker app', 'Accepted privacy notice', 'Location during active jobs, camera, data use'); },
  plogout: () => {
    const A = S.auth.phone;
    if (A.user) logAudit(TRUCKERS[A.user].name, 'Trucker app', 'Signed out', TRUCKERS[A.user].device);
    A.user = null; A.stage = 'login'; A.err = ''; S.phone.screen = 'list'; S.phone.jobId = null;
  },
  cclogin: () => {
    const A = S.auth.cc;
    if (A.lockUntil > S.now) { A.err = `This sign-in is locked until ${hm(A.lockUntil)} after too many wrong tries. Ask System Admin if you need access now.`; return; }
    const email = (S.drafts.ccemail || '').trim().toLowerCase(), pw = S.drafts.ccpw || '';
    if (!email || !pw) { A.err = 'Enter your work email and password.'; return; }
    const u = CC_USERS.find(x => x.email === email);
    S.drafts.ccpw = '';
    if (!u || u.pw !== pw) {
      A.fails++;
      logAudit(u ? u.name : email, 'Command Center', 'Failed sign-in', `Wrong email or password (${A.fails} of ${MAX_FAILS})`);
      if (A.fails >= MAX_FAILS) {
        A.lockUntil = S.now + LOCK_MIN * MIN; A.fails = 0;
        A.err = `Too many wrong tries. Sign-in is locked until ${hm(A.lockUntil)}.`;
        logAudit(u ? u.name : email, 'Command Center', 'Sign-in locked', `${MAX_FAILS} wrong tries, locked ${LOCK_MIN} min`);
      } else A.err = `Email or password is wrong. ${MAX_FAILS - A.fails} ${MAX_FAILS - A.fails === 1 ? 'try' : 'tries'} left.`;
      return;
    }
    A.err = '';
    if (u.mfa) { A.pending = u; A.stage = 'mfa'; S.drafts.ccotp = ''; return; }
    ccEnter(u);
  },
  ccmfa: () => {
    const A = S.auth.cc;
    if (digits(S.drafts.ccotp) !== A.pending.mfa) {
      A.err = 'That code is wrong or expired. Enter the current code from your authenticator app.'; S.drafts.ccotp = '';
      logAudit(A.pending.name, ROLES[A.pending.role], 'Failed 2-step code', 'Command Center');
      return;
    }
    ccEnter(A.pending);
  },
  cclogout: () => {
    const A = S.auth.cc;
    if (A.user) logAudit(A.user.name, ROLES[A.user.role], 'Signed out', 'Command Center');
    A.user = null; A.pending = null; A.err = ''; A.stage = 'login'; S.sel = null; S.page = 'board'; S.drafts.ccotp = '';
  },
  ccfill: email => { const u = CC_USERS.find(x => x.email === email); S.drafts.ccemail = u.email; S.drafts.ccpw = u.pw; S.auth.cc.err = ''; },
  showpw: () => { S.drafts.showpw = !S.drafts.showpw; },
  page: p => { S.page = p; S.sel = null; window.scrollTo(0, 0); },
  filter: f => { S.filter = f; },
  customer: v => { S.customer = v; },
  sel: id => { S.sel = id; S.drafts.revnote = ''; },
  close: () => { S.sel = null; },
  review: kind => {
    const j = job(S.sel), note = (S.drafts.revnote || '').trim();
    if (kind === 'Reject' && !note) { const e = document.getElementById('revnote'); e.placeholder = 'Add a note to explain the rejection'; e.focus(); return 'noop'; }
    Object.assign(j.exception, { status: kind === 'Reject' ? 'Rejected' : 'Validated', cls: kind === 'Reject' ? 'Controllable' : kind, reviewer:'TMD · ' + me().name, reviewNote: note || 'No note.', reviewedAt:S.now });
    j.events.push({ type:'exception.reviewed', at:S.now, label:`${j.exception.status} · ${j.exception.cls} by ${me().name}` });
    S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:`${j.exception.status} exception`, detail:`${j.id} · ${j.exception.code} → ${j.exception.cls}${note ? ' · ' + note : ''}` });
    feed('info', `<b>Exception ${j.exception.status.toLowerCase()}</b> · ${j.id} ${j.exception.code} → ${j.exception.cls}`, j.id);
    S.drafts.revnote = '';
  },
  clearflag: i => {
    const j = job(S.sel), f = j.flags[+i], note = (S.drafts['fnote-' + i] || '').trim();
    if (!note) { const e = document.getElementById('fnote-' + i); e.placeholder = 'Add a note first'; e.focus(); return 'noop'; }
    Object.assign(f, { status:'Cleared', clearedBy:me().name, note });
    S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Cleared integrity flag', detail:`${j.id} · ${f.type} · ${note}` });
    S.drafts['fnote-' + i] = '';
  },
  copy: () => {
    const txt = document.getElementById('copytext').textContent, out = document.getElementById('copied');
    const done = m => { out.textContent = m; };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('copytext')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Text selected. Press Ctrl+C to copy.'); };
    try { navigator.clipboard.writeText(txt).then(() => done('Copied.'), sel); } catch (_) { sel(); }
    return 'noop';
  },
  cfgtoggle: id => { S.config[id] = !S.config[id]; S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Changed rule', detail:`${id} → ${S.config[id] ? 'On' : 'Off'}` }); },
  resetdev: id => { S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Reset device binding', detail:`${TRUCKERS[id].name} · next login binds a new phone` }); TRUCKERS[id].device = 'Not bound · waiting for login'; TRUCKERS[id].bound = '—'; },
};
function mockFlag(j) {
  const L = S.phone.local[j.id]; if (L.mockFlagged) return; L.mockFlagged = true;
  emit({ type:'integrity.flagged', job:j.id, at:S.now, flag:'MOCK_LOCATION', detail:'Fake location app active on trucker phone (com.lexa.fakegps). Confirmation blocked.' });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (fn(el.dataset.arg) !== 'noop') render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sel) { S.sel = null; render(); } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'customer') { ACT[el.dataset.act](el.value); render(); }
  if (el.dataset.cfg) {
    const k = el.dataset.cfg, old = S.config[k], v = Math.max(+el.min, Math.min(+el.max, Math.round(+el.value || 0)));
    if (v !== old) { S.config[k] = v; S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Changed rule', detail:`${k}: ${old} → ${v}` }); }
    render();
  }
  if (el.dataset.rad) {
    const s = SITES[el.dataset.rad], old = s.radius, v = Math.max(50, Math.min(500, Math.round(+el.value || old)));
    if (v !== old) { s.radius = v; S.audit.unshift({ at:S.now, who:me().name, role:ROLES[S.role], action:'Changed geofence', detail:`${s.customer}: ${old} m → ${v} m` }); }
    render();
  }
});
document.addEventListener('submit', e => { const f = e.target.dataset.form; if (!f) return; e.preventDefault(); ACT[f](); render(); });
document.addEventListener('input', e => { const d = e.target.dataset.draft; if (d) S.drafts[d] = e.target.value; });

const h = (location.hash || '').slice(1);
if (['trucker', 'command', 'spec'].includes(h)) S.view = h;
render();
setInterval(tick, 1000);
</script>
